name: moon-cms

# Application services shared by development, staging, and production.
x-app: &app
    image: ${APP_IMAGE:-moon-cms-app:production}
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: production
    env_file:
        - ${APP_ENV_FILE:-.env}
    working_dir: /var/www/html
    restart: unless-stopped
    init: true
    networks:
        - moon

services:
    app:
        <<: *app
        command: php-fpm
        healthcheck:
            test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    nginx:
        image: ${NGINX_IMAGE:-moon-cms-nginx:production}
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: nginx
        restart: unless-stopped
        ports:
            - "${FORWARD_APP_PORT:-8080}:80"
        depends_on:
            app:
                condition: service_healthy
        networks:
            - moon

    queue:
        <<: *app
        command: php artisan queue:work redis --queue=provisioning,mail --tries=5 --timeout=120

networks:
    moon:
        driver: bridge

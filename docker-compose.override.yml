x-development-volumes: &development-volumes
    - .:/var/www/html
    - moon-vendor:/var/www/html/vendor
    - moon-node-modules:/var/www/html/node_modules
    - moon-pnpm-store:/var/www/.local/share/pnpm/store
    - moon-public-build:/var/www/html/public/build
    - moon-bootstrap-cache:/var/www/html/bootstrap/cache
    - moon-storage-framework:/var/www/html/storage/framework
    - moon-storage-logs:/var/www/html/storage/logs

x-development-build: &development-build
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}

services:
    app:
        image: ${APP_DEV_IMAGE:-moon-cms-app:development}
        build: *development-build
        volumes: *development-volumes
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: ${NGINX_DEV_IMAGE:-moon-cms-nginx:development}
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - moon-public-build:/var/www/html/public/build:ro

    queue:
        image: ${APP_DEV_IMAGE:-moon-cms-app:development}
        build: *development-build
        environment:
            MOON_PREPARE_DEV_VOLUMES: "0"
        volumes: *development-volumes
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy

    workspace:
        image: ${APP_DEV_IMAGE:-moon-cms-app:development}
        build: *development-build
        profiles: ["tools"]
        command: ["sleep", "infinity"]
        volumes: *development-volumes
        networks:
            - moon
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-moon_cms}
            POSTGRES_USER: ${DB_USERNAME:-moon}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - moon-postgres-data:/var/lib/postgresql/data
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-moon} -d ${DB_DATABASE:-moon_cms}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - moon

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - moon-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - moon

    mailhog:
        image: mailhog/mailhog:v1.0.1
        restart: unless-stopped
        ports:
            - "${FORWARD_MAILHOG_PORT:-8025}:8025"
            - "${FORWARD_SMTP_PORT:-1025}:1025"
        networks:
            - moon

    mock-realm:
        image: mysql:8.4
        profiles: ["mock-realm"]
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: auth
            MYSQL_USER: trinity
            MYSQL_PASSWORD: trinity
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "${FORWARD_MOCK_REALM_PORT:-3307}:3306"
        volumes:
            - moon-mock-realm-data:/var/lib/mysql
            - ./docker/mock-realm/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 15
        networks:
            - moon

volumes:
    moon-bootstrap-cache:
    moon-mock-realm-data:
    moon-node-modules:
    moon-pnpm-store:
    moon-postgres-data:
    moon-public-build:
    moon-redis-data:
    moon-storage-framework:
    moon-storage-logs:
    moon-vendor:
